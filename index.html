<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Binary Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-card">
        <h1>Pastel Binary Calculator</h1>
        <p class="subtitle">Binary arithmetic with exact precision</p>

        <div class="operations">
            <button class="op-btn active" data-op="add">+</button>
            <button class="op-btn" data-op="sub">−</button>
            <button class="op-btn" data-op="mul">×</button>
            <button class="op-btn" data-op="div">÷</button>
        </div>

        <div class="operator-display">
            <span id="op-symbol">+</span>
        </div>

        <div class="inputs">
            <div class="input-group">
                <label for="operand1">Operand 1</label>
                <input type="text" id="operand1" placeholder="e.g. 1010" autocomplete="off" spellcheck="false">
            </div>
            <div class="input-group">
                <label for="operand2">Operand 2</label>
                <input type="text" id="operand2" placeholder="e.g. 0011" autocomplete="off" spellcheck="false">
            </div>
        </div>

        <div class="buttons">
            <button id="calc-btn">Calculate</button>
            <button id="clear-btn">Clear</button>
        </div>

        <div id="result-box" class="result-box hidden">
            <div id="error-message" class="error hidden"></div>
            <div class="result-content">
                <div class="result-item">
                    <span class="result-label">Binary Result:</span>
                    <span id="binary-result" class="result-value"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">Decimal:</span>
                    <span id="decimal-result" class="result-value"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
