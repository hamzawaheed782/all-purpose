<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 60px 40px;
      text-align: center;
      backdrop-filter: blur(10px);
      max-width: 480px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 12px; }
    p  { opacity: 0.75; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 16px;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello World</h1>
    <p>This is a simple static page served from the <strong>all-purpose</strong> repository.</p>
    <span class="badge">Static Page</span>
  </div>
</body>
</html>
